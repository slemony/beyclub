name: Refresh part catalogue

# Once a day — the Taiwan sheet doesn't move like shop stock, so this is
# mostly a safety net for whenever it does.
#
# Scrape, commit, build and publish all happen in this one workflow on purpose,
# same reasoning as stock.yml: a commit pushed with GITHUB_TOKEN does not
# trigger other workflows, so a scrape-only job would update the repository
# and never reach the live site.
on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC = 11:00 MYT
  # Also on every merge, so a deploy can never ship a build whose catalogue
  # snapshot is missing or older than the code that reads it — the site would
  # otherwise sit on a load error until the next scheduled run.
  #
  # paths-ignore keeps this workflow's own data commit from re-triggering it:
  # the checkout below can push as DATA_PAT, and a PAT push does start
  # workflows.
  push:
    branches: [main]
    paths-ignore:
      - 'public/data/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.DATA_PAT || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Exits non-zero on a parse failure or a collapse in the catalogue, and
      # rewrites nothing when the sheet has not moved.
      - name: Snapshot the Taiwan community sheet
        run: npm run refresh:catalogue

      # The tier of a product is derived from this sheet, so a moved sheet means
      # a stale map. Rebuilt here rather than left to drift, because the one
      # reader that cannot recompute it is the overlay on KGB's own page.
      - name: Rebuild the product tier map
        run: npm run build:tiers

      - name: Commit if the catalogue moved
        run: |
          # Staged before the comparison, unlike the sibling workflows: their
          # data files are already tracked, but the very first snapshot is not,
          # and `git diff` alone never reports an untracked file as a change —
          # so the run that creates it would report "no change" and drop it.
          git add public/data/catalogue.json public/data/product-tiers.json
          if git diff --cached --quiet -- public/data/catalogue.json public/data/product-tiers.json; then
            echo "No change in catalogue."
            exit 0
          fi
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git commit -m "Refresh part catalogue from the Taiwan community sheet"
          git push

      # This job republishes the whole site, not just the data file it just
      # committed, so it needs every variable deploy.yml passes. Anything
      # missing here is silently dropped from the live bundle until the next
      # deploy — which is how a scheduled refresh once took sign-in off the
      # site. Keep this block in step with deploy.yml.
      - run: npm run build
        env:
          VITE_STOCK_REFRESH_URL: ${{ vars.STOCK_REFRESH_URL }}
          VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
