name: Refresh part catalogue

# Once a day — the Taiwan sheet doesn't move like shop stock, so this is mostly a
# safety net for whenever it does.
#
# The scrape writes to the shared Firebase Storage bucket, read live by both the
# test and production sites. There is no longer an on-push trigger: data is
# decoupled from deploys, so a deploy can no longer ship a stale catalogue, and
# no data is committed to git.
on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC = 11:00 MYT
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-catalogue
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The scraper compares against the current snapshot to leave the file
      # untouched when the sheet has not moved.
      - name: Pull current catalogue from the bucket
        run: npm run data:pull -- catalogue.json
        env:
          DATA_BUCKET: ${{ vars.DATA_BUCKET }}

      # Exits non-zero on a parse failure or a collapse in the catalogue, and
      # rewrites nothing when the sheet has not moved.
      - name: Snapshot the Taiwan community sheet
        run: npm run refresh:catalogue

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Push catalogue to the bucket
        run: npm run data:push -- catalogue.json
        env:
          DATA_BUCKET: ${{ vars.DATA_BUCKET }}
