name: Deploy test site (GitHub Pages)

# GitHub Pages is the TEST environment. Production is beyclub.web.app on Firebase
# Hosting (see firebase-hosting.yml). Both build from main and read the same
# datasets from the shared Firebase Storage bucket, so the only difference
# between them is the host and domain — the test site is where a code change is
# seen before it fronts the beyclub.web.app name.
#
# The build no longer bundles any data: the JSON snapshots were moved out of the
# repo into the bucket, and the app fetches them at runtime.
on:
  push:
    branches: [main]
    # The keep-alive heartbeat is not a code change — don't rebuild for it.
    paths-ignore:
      - '.github/last-refresh'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
