name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # An unset Firebase variable is invisible otherwise: the build succeeds
      # and publishes a bundle identical to the last one, so sign-in stays
      # hidden on the live site with nothing in the log to say why. Values
      # are not printed — only whether each one arrived.
      - name: Check Firebase config reached the build
        run: |
          missing=0
          for v in FIREBASE_API_KEY FIREBASE_AUTH_DOMAIN FIREBASE_PROJECT_ID FIREBASE_APP_ID; do
            if [ -z "${!v}" ]; then echo "::warning::$v is empty — sign-in will be hidden on the deployed site"; missing=1
            else echo "$v: set"; fi
          done
          if [ "$missing" = "1" ]; then
            echo "::warning::Set these under Settings > Secrets and variables > Actions > Variables (repository, not environment)."
          fi
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}

      - run: npm run build
        env:
          # The stock "Check now" dispatcher URL (worker/). Unset until deployed,
          # which leaves the button falling back to a plain re-fetch.
          VITE_STOCK_REFRESH_URL: ${{ vars.STOCK_REFRESH_URL }}
          # Firebase web config for the collection tracker's Google sign-in and
          # sync. Not secret — Firestore rules do the actual access control —
          # but kept as repo variables for parity with STOCK_REFRESH_URL above.
          # Unset until the user creates their own Firebase project, which
          # leaves sign-in hidden and the tracker running local-only.
          VITE_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
