name: Deploy production (Firebase Hosting)

# Production: beyclub.web.app. Builds from main and deploys the app to its named
# Hosting site. Reads the same data site as the test site, so promoting a change
# is purely a matter of this deploy succeeding — the data is already shared.
on:
  push:
    branches: [main]
    # The keep-alive heartbeat is not a code change — don't redeploy for it.
    paths-ignore:
      - '.github/last-refresh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Authenticate to Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # deploy:app builds and deploys ONLY the app site (--only hosting:beyclub),
      # so it never touches the data site the scrapers publish to.
      - name: Build and deploy the app
        run: npm run deploy:app
