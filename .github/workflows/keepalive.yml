name: Keep scheduled workflows alive

# GitHub disables scheduled workflows in a public repo after 60 days of no
# repository activity, and a workflow's own runs do not reset that clock. The
# scrapers used to reset it as a side effect of committing fresh data; now that
# they write to the bucket instead and commit nothing, this weekly heartbeat
# keeps the clock from running out and silently stopping the stock refresh.
#
# It commits a single timestamp to .github/last-refresh, a path the deploy
# workflows ignore, so it never triggers a rebuild. Normal development activity
# already keeps the repo alive — this is only insurance for a quiet stretch.
on:
  schedule:
    - cron: '17 4 * * 1' # Mondays, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A PAT push keeps the repository "active" for the 60-day rule; falls
          # back to the default token if the secret is not set.
          token: ${{ secrets.DATA_PAT || github.token }}
      - name: Commit heartbeat
        run: |
          date -u +%FT%TZ > .github/last-refresh
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add .github/last-refresh
          git commit -m "Keep scheduled workflows alive" || exit 0
          git push
