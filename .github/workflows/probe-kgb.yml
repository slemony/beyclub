name: Probe KGB (throwaway)

# THROWAWAY. Delete this workflow and scripts/probe-kgb.mjs once the scrape is
# unblocked.
#
# Every scheduled stock.yml run since 6 Aug has died on the first request with
# 403. The same request from a Malaysian residential IP returns 200, even with
# the scraper's own user-agent, so the failure only exists here — on a hosted
# runner — and that is the only place it can be diagnosed.
#
# Manual only, and reads nothing it could damage: no token, no write permission,
# no commit.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Not in package.json: this is a temporary diagnostic, and the app must not
      # grow a browser dependency for it.
      - name: Install headless Chromium
        run: npm install --no-save playwright-chromium@1

      - name: Probe
        run: node scripts/probe-kgb.mjs
