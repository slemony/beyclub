name: Refresh KGB stock

# Once a day. This ran four times daily to catch a restock the day it happened,
# which stopped being the job on 6 Aug 2026: KGB made the shop members-only, so
# /shop answers every anonymous caller with a sign-in queue and there is no
# shelf to read. The scrape is now a watchdog — it records that the door is
# still shut, and resumes publishing real stock by itself if it ever reopens.
# Asking four times a day for a page we know is closed would be rude.
#
# Scrape, commit, build and publish all happen in this one workflow on purpose.
# A commit pushed with GITHUB_TOKEN does not trigger other workflows, so a
# scrape-only job would update the repository and never reach the live site.
on:
  schedule:
    - cron: '30 0 * * *' # 00:30 UTC = 08:30 MYT (8:30am)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Pushing as a real account keeps the repository "active": GitHub
          # disables scheduled workflows in public repos after 60 days of
          # inactivity, and the workflow's own runs do not reset that clock.
          token: ${{ secrets.DATA_PAT || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Exits non-zero on a parse failure or a collapse in the catalogue, and
      # rewrites nothing when the shelf has not moved.
      - name: Scrape Kelab Gasing Beyblade
        run: npm run refresh:stock

      # New products carry new codes, so the tier map has to keep up with them.
      - name: Rebuild the product tier map
        run: npm run build:tiers

      - name: Commit if the stock moved
        run: |
          if git diff --quiet -- public/data/stock.json public/data/product-tiers.json; then
            echo "No change in stock."
            exit 0
          fi
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add public/data/stock.json public/data/product-tiers.json
          git commit -m "Refresh stock from Kelab Gasing Beyblade"
          git push

      - run: npm run build
        env:
          # Keep the "Check now" dispatcher URL in the bundle this job republishes.
          VITE_STOCK_REFRESH_URL: ${{ vars.STOCK_REFRESH_URL }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
