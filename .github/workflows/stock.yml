name: Refresh KGB stock

# Twice a day, morning and evening MYT — often enough to catch a restock the day
# it happens without hammering someone else's shop.
#
# The scrape writes to the shared Firebase Storage bucket, which both the test
# site (GitHub Pages) and production (beyclub.web.app) read live. So there is no
# build or deploy here, and — unlike before the Firebase migration — no data is
# committed to git.
on:
  schedule:
    - cron: '0 1,13 * * *' # 01:00 and 13:00 UTC = 09:00 and 21:00 MYT
  workflow_dispatch:

# No `contents: write`: this workflow no longer pushes commits. It needs only to
# read the repo and authenticate to Google Cloud to upload the snapshot.
permissions:
  contents: read

concurrency:
  group: data-stock
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Give the scraper the snapshot currently live in the bucket, so its "did
      # the shelf move?" check still works and updatedAt keeps meaning "when
      # stock last changed" rather than "when the job last ran".
      - name: Pull current stock from the bucket
        run: npm run data:pull -- stock.json
        env:
          DATA_BUCKET: ${{ vars.DATA_BUCKET }}

      # Exits non-zero on a parse failure or a collapse in the catalogue, and
      # rewrites nothing when the shelf has not moved.
      - name: Scrape Kelab Gasing Beyblade
        run: npm run refresh:stock

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Uploads only if the file actually changed, so an unchanged shelf leaves
      # the bucket object — and its CDN cache — untouched.
      - name: Push stock to the bucket
        run: npm run data:push -- stock.json
        env:
          DATA_BUCKET: ${{ vars.DATA_BUCKET }}
