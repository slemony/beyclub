name: Refresh KGB stock

# Twice a day MYT — midnight and late afternoon — often enough to catch a
# restock the day it happens without hammering someone else's shop. Readers can
# also pull the latest deployed copy by hand, at most once an hour, from the
# "Where this comes from" sheet on the Stock page.
#
# Scrape, commit, build and publish all happen in this one workflow on purpose.
# A commit pushed with GITHUB_TOKEN does not trigger other workflows, so a
# scrape-only job would update the repository and never reach the live site.
on:
  schedule:
    - cron: '30 9 * * *' # 09:30 UTC = 17:30 MYT (5:30pm)
    - cron: '0 16 * * *' # 16:00 UTC = 00:00 MYT (12:00am)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Pushing as a real account keeps the repository "active": GitHub
          # disables scheduled workflows in public repos after 60 days of
          # inactivity, and the workflow's own runs do not reset that clock.
          token: ${{ secrets.DATA_PAT || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Exits non-zero on a parse failure or a collapse in the catalogue, and
      # rewrites nothing when the shelf has not moved.
      - name: Scrape Kelab Gasing Beyblade
        run: npm run refresh:stock

      - name: Commit if the stock moved
        run: |
          if git diff --quiet -- public/data/stock.json; then
            echo "No change in stock."
            exit 0
          fi
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add public/data/stock.json
          git commit -m "Refresh stock from Kelab Gasing Beyblade"
          git push

      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
