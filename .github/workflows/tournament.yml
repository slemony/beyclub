name: Refresh tournament data

# BBXHub recomputes every Friday, so we pick it up on Saturday morning MYT.
#
# The scrape writes to the shared Firebase Storage bucket, read live by both the
# test and production sites — no build, no deploy, and no data committed to git.
on:
  schedule:
    - cron: '0 2 * * 6' # Sat 02:00 UTC = 10:00 MYT
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-tournament
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The scraper compares against the current snapshot to leave the file
      # untouched when coverage has not moved.
      - name: Pull current tournament data from the bucket
        run: npm run data:pull -- tournament.json
        env:
          DATA_BUCKET: ${{ vars.DATA_BUCKET }}

      # Exits non-zero on a parse failure or a collapse in coverage, leaving the
      # bucket's dataset in place rather than publishing an empty one.
      - name: Scrape BBXHub
        run: npm run refresh:tournament

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Push tournament data to the bucket
        run: npm run data:push -- tournament.json
        env:
          DATA_BUCKET: ${{ vars.DATA_BUCKET }}
