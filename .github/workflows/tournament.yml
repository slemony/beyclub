name: Refresh tournament data

# BBXHub recomputes every Friday, so we pick it up on Saturday morning MYT.
#
# The scrape publishes to the Firebase Hosting data site, read live by both the
# test and production sites — no app build, and no data committed to git. The
# deploy runs only when coverage moved.
on:
  schedule:
    - cron: '0 2 * * 6' # Sat 02:00 UTC = 10:00 MYT
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-deploy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Pull the whole live set: the scraper compares against the current data,
      # and the deploy re-publishes all five files.
      - name: Pull current data
        run: npm run data:pull

      - name: Note the data we started from
        run: cp public/data/tournament.json "$RUNNER_TEMP/before.json" 2>/dev/null || true

      # Exits non-zero on a parse failure or a collapse in coverage, leaving the
      # live dataset in place rather than publishing an empty one.
      - name: Scrape BBXHub
        run: npm run refresh:tournament

      - name: Did the tournament data change?
        id: diff
        run: |
          if [ -f "$RUNNER_TEMP/before.json" ] && cmp -s public/data/tournament.json "$RUNNER_TEMP/before.json"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change in tournament data — skipping deploy."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Firebase
        if: steps.diff.outputs.changed == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy the data site
        if: steps.diff.outputs.changed == 'true'
        run: npm run deploy:data
